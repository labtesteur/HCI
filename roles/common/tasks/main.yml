---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: safe

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Configure cluster hosts file
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE HCI CLUSTER"
    block: |
      {% for host in hci_hosts %}
      {{ host.ip }} {{ host.hostname }} {{ host.hostname | lower }}.{{ hci_domain }}
      {% endfor %}

- name: Enable Chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true
